# Profile de desenvolvimento local. Ative com SPRING_PROFILES_ACTIVE=local.
spring:
  datasource:
    password: ${DB_PASSWORD:loja}

logging:
  pattern:
    # Formato enxuto para o terminal: hora, nível, aviso (só quando houver), classe e mensagem.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-36logger{0}){cyan} : %replace([aviso %X{notificationId}] ){'\\[aviso \\] ', ''}%m%n%wEx"

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

cliente:
  webhook:
    secret: ${CLIENTE_WEBHOOK_SECRET:local-dev-only-client-secret-0123456789abc}
  simulation:
    enabled: true
